# ============================================================
# V1 continuation run: resume the 100-epoch centre-balanced model and train
# through epoch 199 (100 additional epochs) without overwriting the source run.
# ============================================================

env:
  python: "E:/CondaEnvData/envs/GGMPC/python.exe"
  device: "cuda"
  seed: 42

data:
  base: "data/processed_scene_v1"
  batch_size: 64
  num_workers: 0

model:
  horizon: 128
  d_model: 128
  num_heads: 4
  joint_blocks: 8
  ffn_dim: 512
  map_res: 256

  global_mem_res: 16
  geo_decode_res: 64
  geo_mem_res: 32
  geo_attn_every: 2
  geo_sigma: 0.25
  geo_bias_clip: 8.0
  dropout: 0.0

diffusion:
  timesteps: 16
  beta_schedule: "squaredcos_cap_v2"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "x0"

loss:
  lambda_e: 1.0
  lambda_smooth: 0.1
  smooth_acc_weight: 0.25
  smooth_jerk_weight: 1.0
  lambda_iou: 0.25
  lambda_safe: 0.1
  safe_cvar_fraction: 0.2
  safe_cvar_weight: 1.0
  ellipse_safe_res: 64
  ellipse_mask_tau: 10.0
  ellipse_safe_chunk: 32

train:
  # train.py treats this as the final total epoch count. The source checkpoint
  # is epoch 99, so epochs 100..199 are exactly 100 additional epochs.
  epochs: 200
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  log_interval: 20
  save_every: 10
  eval_every: 10
  val_batches: 25
  ckpt_dir: "outputs/ckpt_v1_smooth_iou_free_cvar_center_balanced_continue100"
