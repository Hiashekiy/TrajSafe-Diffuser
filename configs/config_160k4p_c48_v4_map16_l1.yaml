# ============================================================
# config_160k4p_c48_v4_map16_l1 —— v4 + 控制点主干从 8 层减到 1 层
#
# 与 config_160k4p_c48_v4_map16.yaml 的**唯一**差异：
#   model.traj_blocks: 8 -> 1
# 其余（16×16 单地图特征、Δ-only 反馈、统一连续安全损失 L_safe、
# 48 控制点、final_blocks=3、skeleton_blocks=2、数据根、优化器与预算）全部继承，
# 因此这是一条严格的单变量对照（主干深度）。
#
# 为什么可以只有 1 层：
#   - 轨迹表示本身已经是 48 个 B 样条控制点（token），"序列建模"的负担比 128 点
#     曲线时代小得多；
#   - 每个 TrajBlock 都带一次对 16×16 地图特征 C_G 的交叉注意力，
#     8 层 = 8 次重复读同一份 256-token 地图（约 2.9 M 参数集中在这次重复上）；
#   - 交互容量并没有因此消失：骨架侧仍有 SkeletonEncoder(2 层) + MatchBlock，
#     末端仍有 FinalDenoiser(3 层)，反馈还有门控融合。
#
# 参数量：8 层 6.52 M -> 1 层 ~3.98 M（每层 TrajBlock 0.363 M）。
# ============================================================
base: "configs/config_160k4p_c48_v4_map16.yaml"

model:
  traj_blocks: 1                       # 控制点主干深度（唯一自变量）

train:
  ckpt_dir: "outputs/models/v4_map16_c48_l1/ckpt"
