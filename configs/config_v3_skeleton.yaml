# ============================================================
# V3: TrajSafe-Diffuser - report-faithful architecture
#   docs/TrajSafe-Diffuser_网络结构设计报告_实现细化版.md
#   ONE diffusion state: trajectory P_t [B,H,2].
#   Ellipse is NOT a diffusion state and ellipse centres come from
#   c_i = Gamma_m(s_i) - there is no centre head.
# ============================================================

env:
  python: "E:/CondaEnvData/envs/GGMPC/python.exe"
  device: "cuda"
  seed: 42

data:
  source: "data/processed_scene_v1"    # trajectory / endpoints / maps
  base: "data/processed_scene_v3"      # candidate cache + ellipse labels
  mazes: ["large"]                     # only the large map is used for training
  batch_size: 16
  num_workers: 0
  splits: ["train", "val", "test"]
  ellipse_mask_res: 64                 # lazy GT soft mask resolution
  ellipse_mask_tau: 10.0               # same rasteriser as the loss

skeleton:
  safety_dilation_cells: 1
  thinning_backend: "auto"
  pure_cycle_aux_nodes: 2

# --- candidate topology (offline cache) ---------------------------------
topology:
  num_candidates: 4
  raw_k: 128
  max_length_ratio: 1.5
  dedup_jaccard: 0.75
  candidate_points: 128                # L, S_m network input length
  candidate_geometry_points: 1280      # dense Gamma_m padding budget
  anchor_candidates: 16
  tau_gt: 0.05

model:
  horizon: 128
  d_model: 128
  num_heads: 4
  traj_blocks: 8                       # Trajectory Backbone N_T
  skeleton_blocks: 2                   # Skeleton Transformer N_S
  final_blocks: 3                      # Final Denoiser N_F
  ffn_dim: 512
  map_res: 256
  global_mem_res: 16                   # C_G 16x16
  geo_decode_res: 64                   # fine-geometry decoder output
  geo_mem_res: 32                      # C_E 32x32
  geo_sigma: 0.25
  geo_bias_clip: 8.0
  dropout: 0.0
  coord_hidden: 256                    # MLP_T / MLP_S / MLP_C hidden width
  head_hidden: 256                     # score / shape head hidden width
  assert_shapes: true                  # report section 27.4 assertions

# --- ellipse label generation (scripts/data/14_build_ellipse_labels_v3.py)
ellipse_label:
  num_orientations: 36
  local_radius: 0.25
  dilation: 1
  boundary_points: 128
  interior_rings: 4
  interior_angles: 32
  binary_iters: 12
  min_semi_axis: 1.0e-3

diffusion:
  timesteps: 16
  beta_schedule: "squaredcos_cap_v2"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "x0"

# --- loss (report section 25) -------------------------------------------
loss:
  lambda_traj: 1.0
  lambda_coarse: 0.5
  lambda_smooth: 0.08
  smooth_acc_weight: 0.25
  smooth_jerk_weight: 1.0

  lambda_topology: 0.25

  # balanced initial contributions (20-batch large-only probe):
  # Ltraj 13% / Lcoarse 13% / Lsmooth 13% / Ltopo 15%
  # Lalign ~0.5% / Lshape 17% / Liou 15% / Lsafe 14%
  # Lalign is naturally small because Gamma(s) already starts near the GT
  # trajectory; raise lambda_align only if progress visibly lags.
  lambda_align: 5.0
  lambda_shape: 0.08
  lambda_iou: 0.25
  lambda_safe: 0.15

  ellipse_safe_res: 64
  ellipse_mask_tau: 10.0
  ellipse_safe_chunk: 32
  safe_cvar_fraction: 0.2
  safe_cvar_weight: 1.0

train:
  epochs: 100
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  log_interval: 50
  save_every: 10
  eval_every: 10
  val_batches: 25
  ckpt_dir: "outputs/ckpt_v3_skeleton"

eval:
  num_candidates_ablation: [1, 2, 4]
  samples_per_od: 4

# --- inference-only ALM (augmented Lagrangian) guidance ------------------
# Strictly inference-time: the network, the checkpoint and the training losses
# are untouched.  It consumes the V3 prediction (center = Gamma(s), shape4)
# and first-order corrects x0 inside verified convex regions built online from
# the current occupancy.  The dashboard reads this section; training ignores it.
alm:
  enabled: true
  log_per_step: true

  # Apply ALM only to the final eight levels of the 16-step reverse process.
  start_t: 7
  inner_steps: 4

  # Constraints use exact max + active-face subgradient. This avoids the
  # positive tau*log(N) bias of an unnormalised smooth maximum.

  # Each reverse step rebuilds corridors and starts fresh dual variables. The
  # primal objective also keeps corrections close to and as smooth as raw P0.
  step_size: 0.03
  rho: 5.0
  proximity_weight: 1.0
  correction_smooth_weight: 20.0
  max_grad_norm: 1.0
  max_correction_per_step: 0.10

  # One predicted ellipse -> one local Neural-IRIS convex region. A dense ring
  # of local-map border points prevents unbounded regions. All real and border
  # obstacle points use the same Mahalanobis ordering/filtering, without caps.
  safety_margin: 0.02
  obstacle_window_half: 0.35
  obstacle_dilation: 0
  # Do not move physically safe waypoints merely because a predicted local
  # convex region is conservative. One-cell dilation supplies a small margin.
  guidance_dilation_cells: 1
  guidance_occupancy_threshold: 1.0e-3
  segment_collision_samples: 8
  corridor_chunk_size: 512
  ellipse_axis_min: 0.002
  ellipse_axis_max: 2.0
  # filter_eps defaults to Neural-IRIS's 1e-3 pixel tolerance converted to
  # scene coordinates.
