# ============================================================
# config_160k4p_c48_oneshot —— 48 控制点 B 样条，在 k=4 边界保护腐蚀缓存上重训
#
# 与 config_160k4p_oneshot.yaml（C=32，同一 k=4 缓存、同一 recipe、同样 200 轮）
# 构成「控制点数量」的严格单变量对照：几何/损失/feedback/alm/corridor 全部继承，
# 只改 model.num_controls / bspline.num_controls 与数据根、输出目录。
#
#   C     ckpt                  数据根
#   32    outputs/oneshot_k4p        data/carla_processed_160k4p
#   48    outputs/oneshot_k4p_c48    data/carla_processed_160k4p_c48   <- 本配置
#
# 为什么 C 变了必须换数据根（而不是原地改）：
#   control_gt.npy 是**离线数据**（用与网络解码同一个端点约束最小二乘投影，从
#   trajectory_128 拟合出的控制多边形标签）。数据加载器在 config 的
#   num_controls 与 control_gt.npy 形状不一致时会直接报错退出，所以 C=48 需要
#   一份重新拟合过控制点标签的缓存。C 是 C 之外**唯一**受影响的派生标签：ALM
#   约束包按 model.num_safety_queries(=128) 个走廊单元存储，候选/椭圆标签只依赖
#   occupancy 与 conditions，occupancy 更与 C 无关 —— 所以新缓存用
#   scripts/data/carla_full/06_refit_controls.py 从 curve_gt.npy 重拟合
#   control_gt，其余数组逐字节复制复用（保证单变量）。
#
# 提示：control_gt 的拟合 RMSE 会随 C 增大而下降（自由度更多），这是本实验的
# 自变量本身；若要判断「48 点是否更贴合真实轨迹」，直接看
# data/carla_processed_160k4p_c48/refit_controls_report.json 里两个 C 的
# decode RMSE 对比。
# ============================================================
base: "configs/config_160k4p_oneshot.yaml"

data:
  processed_root: "D:/ProjectDirectory/Neural-IRISDiffuser/data/carla_processed_160k4p_c48"

# The ONE number of control points: read by src/utils/config.num_controls() from
# BOTH keys (they are refused to disagree).  bspline.knots="auto" regenerates the
# clamped uniform knot vector for C=48, so no knot file has to be rebuilt.
model:
  num_controls: 48                     # C: cubic B-spline control polygon

bspline:
  num_controls: 48

train:
  ckpt_dir: "outputs/oneshot_k4p_c48/ckpt"

# --- 信任域（唯一的 ALM 覆盖）-------------------------------------------
# ALM 每个内迭代允许的**真实曲线位移**上限 `max_i ‖(B·ΔQ)_i‖`，scene 单位
# （1 scene = 80 m）。基座 config_160k8p.yaml 是 0.03 = 2.4 m/步。
#
# 实测（同协议 420 样本 test / ALM 开 / 已含地图边界半空间修复，见 §12.8）：
#   0.03（基座）-> 3/420 碰撞   best_task 模型上 max 曲线修正 15.3 m
#   0.10         -> 1/420 碰撞
#   无限（去掉）  -> 数值发散：26 个样本的控制点变 NaN，rmse=nan，整轮作废
#
# 这里试 **0.20 = 16 m/步**（10 次内迭代 → 累积上限 160 m）。注意这个界是
# **每步增量**的界，不是累积量的界；把它设得很大时行为会在"收敛"与"来回震荡"
# 之间摆动（λ 无上限，`ΔQ` 是累积量），所以每次调整都要重跑同协议评测。
alm:
  max_curve_step_scene: 0.20

  # --- 末端硬投影（保证输出可行）-----------------------------------------
  # ALM 在 guided 阶段每步只有固定预算、且一旦整批可行就早停，所以**采样结束时
  # 返回的控制点未必满足冻结的约束包**（实测这一轮 420 个样本里有 53 个最终
  # 违反量仍为正）。这里在 reverse 循环结束后、解码成曲线之前做一次【真·硬投射】：
  #   min Σ|ΔQ|₁  s.t.  M q ≤ v（每段 Bezier 的 4 个控制点都落在责任凸区域内）
  # 写成一个 LP 交给 HiGHS **精确求解**（不是再跑一遍 ALM 迭代），因此返回的多边
  # 形带【可行性证书】而不是容差级近似；L1 目标让修正尽量稀疏（只动少数控制点）。
  #   * 已经满足约束的样本原样返回，一次 LP 都不解；
  #   * 端点（start/goal）作为硬等式钉住；若它们让 LP 不可行，保留输入并标记
  #     hard_project_feasible = False；
  #   * 解完后再用同一套约束重新校验返回的多边形（certificate）。
  # 实测（420 样本同协议）：最终违反量 > 0 的样本 53 → 0，最差 +4.8e-4 → −1.8e-7，
  # 走廊归属率 = 1.0 的样本 367 → 420，碰撞与 rmse 不变。
  final_project: true
  # 精确性容差：LP 解出后重新校验返回的多边形，要求 max(M q - v) <= 该值。
  final_project_tol: 1.0e-9
