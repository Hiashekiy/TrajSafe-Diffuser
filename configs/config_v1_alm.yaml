# Inference-only ALM guidance. The network/checkpoint and training losses are
# inherited unchanged from the frozen centre-balanced V1 configuration.
base: configs/config_v1.yaml

alm:
  enabled: true
  log_per_step: true

  # Apply ALM only to the final eight levels of the 16-step reverse process.
  start_t: 7
  inner_steps: 4

  # Constraints use exact max + active-face subgradient. This avoids the
  # positive tau*log(N) bias of an unnormalised smooth maximum.

  # Each reverse step rebuilds corridors and starts fresh dual variables. The
  # primal objective also keeps corrections close to and as smooth as raw P0.
  step_size: 0.03
  rho: 5.0
  proximity_weight: 1.0
  correction_smooth_weight: 20.0
  max_grad_norm: 1.0
  max_correction_per_step: 0.10

  # One predicted ellipse -> one local Neural-IRIS-style convex region. Four
  # slots bound the queried local box and the rest separate local obstacles.
  max_faces: 20
  safety_margin: 0.02
  obstacle_window_half: 0.35
  obstacle_dilation: 0
  # Do not move physically safe waypoints merely because a predicted local
  # convex region is conservative. One-cell dilation supplies a small margin.
  guidance_dilation_cells: 1
  guidance_occupancy_threshold: 1.0e-3
  segment_collision_samples: 8
  corridor_chunk_size: 512
  max_obstacle_points: 4096
  ellipse_axis_min: 0.002
  ellipse_axis_max: 2.0
  dedup_eps: 1.0e-6
