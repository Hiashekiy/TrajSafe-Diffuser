# ============================================================
# V1: Occupancy-Conditioned Joint Trajectory–Geometry Diffusion Transformer
# (docs/联合扩散.md).  Replaces the old zero-sum / sequential two-branch stack.
# ============================================================

env:
  python: "E:/CondaEnvData/envs/GGMPC/python.exe"
  device: "cuda"          # falls back to cpu when cuda unavailable
  seed: 42

data:
  base: "data/processed_scene_v1"   # positions[N,128,2] + ellipses6[N,128,6]
  batch_size: 16
  num_workers: 0

model:
  horizon: 128        # H waypoints (p1=s ... p128=g)
  d_model: 128
  num_heads: 4        # head dim = 32
  joint_blocks: 8     # Joint Diffusion Transformer blocks
  ffn_dim: 512
  map_res: 256        # occupancy input resolution

  # V1.1 dual scene memory: global 16x16 (kept) + fine geometry 32x32
  global_mem_res: 16  # (legacy alias mem_res: 16)
  geo_decode_res: 64  # fine decoder restores 16->32->64 ...
  geo_mem_res: 32     # ... then merge (stride-2) to 32x32 = 1024 geometry tokens
  geo_attn_every: 2   # GeometryCA only at joint blocks 2/4/6/8
  geo_sigma: 0.25     # noise-aware spatial bias sigma (scene units)
  geo_bias_clip: 8.0  # clamp(-8, 0) on the geometry attention bias

  dropout: 0.0

diffusion:
  timesteps: 16       # shared schedule for P and E (sqrt-alpha-bar cosine)
  beta_schedule: "squaredcos_cap_v2"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "x0"   # heads predict clean P0/E0 (x0); DDIM sampler stable
                          # with the T=16 cosine schedule (eps-pred would divide
                          # by sqrt(alpha_bar)~0.003 and blow up)

loss:
  lambda_e: 1.0       # ellipse x0 regression
  lambda_smooth: 0.1  # SmoothL1 between predicted/GT trajectory second differences
  lambda_safe: 1.0    # obstacle fraction inside each ellipse; trajectory anchor is detached
  ellipse_safe_res: 64    # full-map raster resolution used by the safety loss
  ellipse_mask_tau: 10.0  # soft ellipse boundary sharpness
  ellipse_safe_chunk: 32  # ellipse anchors rasterized per chunk (memory control)

train:
  epochs: 100
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  log_interval: 20
  save_every: 10
  eval_every: 10      # validation loss every N epochs
  val_batches: 25
  ckpt_dir: "outputs/ckpt_v1_smooth_safe_detach"
