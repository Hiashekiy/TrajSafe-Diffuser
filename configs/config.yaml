# ============================================================
# Maze2D 安全扩散规划器 —— 单一主配置（混合三场景训练 / 离线 IRIS 标签）
#
# 说明：
#   - 这个文件是全部超参/路径的唯一来源，后端代码只读这里，不在代码里硬编码数值。
#   - 默认把三张迷宫数据混合，train.py 使用 data/processed_scene 数据集；
#     同时保留「离线 IRIS MVIE」椭圆标签生成（scripts/data/04）与 mixed 构建（scripts/data/build_mixed_dataset.py）。
#   - 不再依赖 Neural-IRIS 网络（其模型/benchmark 已归档到 _archive/neural_iris_legacy/）。
#
# 用法：
#   python train.py --config configs/config.yaml
#   python scripts/data/04_generate_ellipse_labels.py --config configs/config.yaml
# ============================================================

# ---------- 环境与通用 ----------
env:
  # 运行训练/采样用的 Python 可执行文件（仅作记录/便捷脚本调用用）
  python: "E:/CondaEnvData/envs/GGMPC/python.exe"
  # 计算设备；'cuda' 时若 torch 检测到 CUDA 就用 GPU，否则回退 CPU
  device: "cuda"
  # 全局随机种子（set_seed 会固定 numpy / torch 随机数）
  seed: 42

# ---------- 数据（umaze 单场景旧默认，保留用于 sample/evaluate/单场景脚本兼容）----------
# 注意：训练不直接用这里的 processed_dir / maze；实际训练数据是 data/processed_scene。
data:
  maze: "umaze"                                     # 迷宫名（旧单场景默认）
  raw_hdf5: "data/d4rl/maze2d-umaze-sparse-v1.hdf5" # 原始 D4RL 数据（重新准备时用）
  raw_dir: "data/d4rl"                              # 原始数据目录
  processed_dir: "data/processed/maze2d_umaze"      # umaze 预处理输出目录（旧单场景）
  horizon: 128                                      # 轨迹长度/扩散模型窗口长度
  stride: 32                                        # 切窗步长
  max_episodes: 0                                   # 0=使用全部轨迹（限制条数用）
  train_val_test: [0.9, 0.05, 0.05]                 # 切分比例

# ---------- 几何 / 地图（umaze 旧默认，仅作模型构造兜底）----------
# scene 用 [0,8]^2 网格（见 EXTENT），此处 extent 只是 Planner 构造时的兜底。
geometry:
  coord_module: "src/geometry/d4rl_coordinates.py"   # 坐标/墙心换算模块
  maze_name: "umaze"                                 # 迷宫名（旧）
  obs_offset: [1.2, 1.2]                             # qpos→obs 坐标偏移
  wall_half: 0.5                                     # 墙半宽
  particle_radius: 0.1                               # 粒子半径（SDF 膨胀用）
  cell_map: "round"                                  # 占位网格取整方式
  extent: [0, 4, 0, 4]                               # [x0,x1,y0,y1] 世界范围（umaze）
  global_res: 20.0                                   # 网格分辨率（格/单位长度）
  inflate_particle: true                             # 占位图是否按粒子半径膨胀
  occupancy_threshold: 0.002                         # 占位阈值
  local_patch_size: 128                              # 局部 patch 边长（像素）
  local_res: 20.0                                    # 局部 patch 分辨率（离线 IRIS 用）

# ---------- 三张迷宫（离线 IRIS 标签生成 + mixed 构建使用）----------
# 训练本身不遍历这里，但重生成椭圆标签(04) 和 构建 mixed 需要各迷宫几何。
mazes:
  - name: "umaze"                                    # 迷宫标识（写进标签/目录名）
    raw_hdf5: "data/d4rl/maze2d-umaze-sparse-v1.hdf5"
    processed_dir: "data/processed/maze2d_umaze"     # 该迷宫预处理目录（含 map/trajectories/normalization）
    extent: [0, 4, 0, 4]                             # 世界坐标范围
    global_res: 20.0                                 # 全局网格分辨率
    local_res: 20.0                                  # 离线 IRIS 局部 patch 分辨率
  - name: "medium"
    raw_hdf5: "data/d4rl/maze2d-medium-sparse-v1.hdf5"
    processed_dir: "data/processed/maze2d_medium"
    extent: [0, 8, 0, 8]
    global_res: 10.0   # 重采样：16x16 -> 80x80（与 umaze 相当）
    local_res: 20.0
  - name: "large"
    raw_hdf5: "data/d4rl/maze2d-large-sparse-v1.hdf5"
    processed_dir: "data/processed/maze2d_large"
    extent: [0, 9, 0, 12]
    global_res: 8.0    # 重采样：12x9 -> 72x96（模型自适应不同 scene 尺寸）
    local_res: 20.0

# ---------- 模型 ----------
model:
  horizon: 128        # 预测轨迹长度（= 扩散时间步序列长度）
  state_dim: 6        # 状态维度：[ax, ay, x, y, vx, vy]
  d_model: 128        # Transformer/特征维度
  num_heads: 8        # 注意力头数
  trajectory_encoder_layers: 2   # 轨迹编码器层数（噪声轨迹）
  trajectory_decoder_layers: 4   # 轨迹解码器层数
  ffn_dim: 512        # 前馈维度
  local_window: 9     # 局部场景采样窗口（每点取多少邻域）
  local_res: 64       # 局部场景特征分辨率（SceneEncoder decoder 输出）
  ellipse_aggregator_layers: 2   # 椭圆 set-attention 层数
  ellipse_relative_pe: true      # 椭圆分支使用相对位置编码（仅加在 Local_2 上）
  ellipse_relative_pe_scale: 128.0  # 相对 PE 放大系数（小偏移需高频率）
  dropout: 0.1        # Dropout 比例

# ---------- 扩散 ----------
diffusion:
  timesteps: 16           # 扩散时间步数（T），先 16 步，后续可升到 32/64
  prediction_type: "sample"  # 预测目标：直接预测 x0（clean sample）
  beta_schedule: "squaredcos_cap_v2"  # 噪声调度
  beta_start: 0.0001      # 起始噪声强度
  beta_end: 0.02          # 终止噪声强度

# ---------- 训练 ----------
train:
  batch_size: 32           # 批大小（混合三迷宫数据，sample 级混合）
  epochs: 100              # 训练轮数（可被 --epochs 覆盖）
  lr: 1.0e-4               # 学习率（traj/joint 阶段默认）
  traj_lr: 1.0e-4          # Phase1 轨迹模块学习率
  ellipse_lr: 1.0e-4       # Phase2 椭圆模块学习率
  local_decoder_lr: 1.0e-5 # Phase2 局部解码器微调学习率（0.1*ellipse_lr）
  weight_decay: 1.0e-4     # AdamW 权重衰减
  grad_clip: 1.0           # 梯度裁剪范数（0/None 表示不裁剪）
  num_workers: 0           # DataLoader 进程数（Windows 下建议 0）
  save_every: 10           # 每多少轮保存一次 checkpoint
  warmup_epochs: 3         # 前 N 轮只训练 L_diff + 小 L_smooth（热身课程）
  ckpt_dir: "outputs/ckpt"           # 模型保存目录

# ---------- 损失权重 ----------
loss:
  # 损失权重：L_Z 固定锚=1；L_p/L_param/L_iou/L_smooth 用 GradNorm 自动调；L_col 用 Lagrangian；L_axis 走 ramp
  lambda_z: 1.0           # 主扩散损失 L_Z（最重要，给最大权重）
  lambda_p: 0.5           # 中间位置重建损失 L_p
  lambda_smooth: 0.05     # 轨迹平滑损失 L_smooth
  lambda_ellipse: 0.5     # 椭圆参数损失总权重 L_param
  lambda_iou: 0.3         # 椭圆软 IoU 损失权重 L_iou
  ellipse_margin: 1.0     # 椭圆 IoU 局部网格边距
  lambda_c: 1.0           # 椭圆中心损失（子项）
  lambda_r: 1.0           # 椭圆半径损失（子项）
  lambda_theta: 1.0       # 椭圆方向（双角度向量）损失（子项）
  # 阶段式辅助损失（相对权重）
  lambda_collision: 0.3         # L_collision 固定权重（从第 1 个 epoch 起一直生效）
  lambda_collision_max: 0.3     # 早期 ramp 版本的上限（现被 lambda_collision 固定值取代）
  axis_warmup_epochs: 3         # L_axis 开启轮数（保留，备用）
  axis_ramp_epochs: 20          # L_axis 线性爬坡轮数
  collision_warmup_epochs: 10   # 早期 ramp 版本的开启轮数（现不再用于 ramp）
  collision_ramp_epochs: 30     # 早期 ramp 版本的爬坡轮数
  collision_margin: 0.0         # 碰撞 SDF 安全边距（场景坐标）
  collision_sigma: 0.1          # 碰撞软判定平滑系数
  lambda_align: 0.1             # L_align（轨迹方向与椭圆长轴对齐）权重

# ---------- 椭圆损失（Neural-IRIS 风格）----------
ellipse_loss:
  lambda_param: 10.0   # L_param 内权重（center/radius/angle）
  lambda_iou: 5.0      # L_iou 内权重
  lambda_coll: 2.0     # L_ecoll 内权重（预测椭圆与障碍重叠）
  lambda_anchor: 5.0   # L_anchor 内权重（轨迹点位于椭圆内）
  soft_mask_tau: 10.0  # 椭圆 soft mask 温度（sigmoid 平滑）
  near_circle_angle_mask: true   # 近圆椭圆 mask 掉角度损失 / 对齐损失
  near_circle_tau: 0.1           # 近圆判定阈值：|r1-r2|/(r1+r2) < tau
  ellipse_margin: 1.0            # 椭圆 IoU/碰撞 局部网格边距（场景坐标）

# ---------- 联合阶段（Phase3）椭圆 ramp ----------
joint_ellipse:
  ramp: true                # 是否对 lambda_E 做线性 ramp
  ramp_ratio: 0.2           # 前 20% joint epochs 线性爬坡
  lambda_max: 1.0           # lambda_E 上限

# ---------- 离线 IRIS（椭圆标签生成）----------
# 仅保留离线 MVIE 求解器需要的两项；Neural-IRIS 网络相关已删除。
iris:
  patch_size: 128         # 局部 patch 边长（像素），离线 IRIS 在 patch 内求解
  cache_resolution: 0.05  # 位置栅格去重粒度（世界坐标，越大缓存命中越高、越省算力）
