# ============================================================
# TrajSafe-Diffuser - CARLA v1 + 32-control cubic B-spline diffusion
#
#   ONE diffusion state: the control polygon Q_t [B,32,2].
#   The network still reasons on the decoded curve P_t = B_128 Q_t [B,128,2].
#   Ellipse centres are NOT a diffusion state, NOT a head output and NOT a
#   progress prediction: c_i = Gamma_m(i/127) on the selected dense Skeleton.
#   There is no learned progress and no L_align.
# ============================================================

env:
  python: "E:/CondaEnvData/envs/GGMPC/python.exe"
  device: "cuda"
  seed: 42

data:
  dataset: "carla_v1"
  root: "D:/ProjectDirectory/Neural-IRISDiffuser/data/carla_v1"
  processed_root: "D:/ProjectDirectory/Neural-IRISDiffuser/data/carla_processed"
  batch_size: 16
  num_workers: 0
  splits: ["train", "val", "test"]
  ellipse_mask_res: 64                 # GT / prediction soft-mask resolution
  ellipse_mask_tau: 10.0
  # legacy Maze2D roots (kept so old tooling can still read the config)
  scenes: "data/scenes"
  skeleton: "data/skeleton"
  mazes: ["large"]

skeleton:
  safety_dilation_cells: 1
  thinning_backend: "auto"
  pure_cycle_aux_nodes: 2

# --- candidate topology (offline cache) ---------------------------------
topology:
  num_candidates: 4
  raw_k: 128
  max_length_ratio: 1.5
  dedup_jaccard: 0.75
  candidate_points: 128                # L, S_m network input length
  candidate_geometry_points: 1280      # dense Gamma_m padding budget
  anchor_candidates: 16
  tau_gt: 0.05

model:
  horizon: 128
  num_controls: 32                     # cubic B-spline control polygon
  d_model: 128
  num_heads: 4
  traj_blocks: 8                       # Trajectory Backbone N_T
  skeleton_blocks: 2                   # Skeleton Transformer N_S
  final_blocks: 3                      # Final Denoiser N_F
  ffn_dim: 512
  map_res: 256
  global_mem_res: 16                   # C_G 16x16
  geo_decode_res: 64                   # fine-geometry decoder output
  geo_mem_res: 32                      # C_E 32x32
  geo_sigma: 0.25
  geo_bias_clip: 8.0
  dropout: 0.0
  coord_hidden: 256
  head_hidden: 256
  assert_shapes: true

# --- fixed B-spline codec (src/geometry/bspline.py) ---------------------
bspline:
  degree: 3
  num_controls: 32
  curve_points: 128
  knots: "D:/ProjectDirectory/Neural-IRISDiffuser/data/carla_v1/bspline_knots.npy"
  endpoint_constrained: true

# --- ellipse label generation (scripts/data/carla/02_build_ellipse_labels.py)
ellipse_label:
  num_orientations: 36
  local_radius: 0.25
  dilation: 1
  # The safe ellipse is TINY (semi-axes <= local_radius = 0.25 m = 0.8 cells),
  # so 48 boundary + 2x12 interior samples already cover every cell the ellipse
  # can touch; 8 binary steps give a ~0.4 % axis resolution.  The exact same
  # safety criterion as scripts/data/03_build_ellipse_labels.py is used.
  boundary_points: 48
  interior_rings: 2
  interior_angles: 12
  binary_iters: 8
  min_semi_axis: 1.0e-3

diffusion:
  timesteps: 16
  beta_schedule: "squaredcos_cap_v2"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "x0"

# --- loss ---------------------------------------------------------------
loss:
  lambda_traj: 1.0
  lambda_control: 0.2
  lambda_coarse: 0.5
  lambda_smooth: 0.08
  smooth_acc_weight: 0.25
  smooth_jerk_weight: 1.0
  lambda_topology: 0.25
  lambda_shape: 0.08
  lambda_iou: 0.25
  lambda_safe: 0.15
  ellipse_safe_res: 64
  ellipse_mask_tau: 10.0
  ellipse_safe_chunk: 32
  safe_cvar_fraction: 0.2
  safe_cvar_weight: 1.0

train:
  epochs: 200
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  log_interval: 20
  save_every: 5
  eval_every: 1
  val_batches: 12
  max_hours: 6.5
  ckpt_dir: "outputs/bspline_carla/ckpt"

eval:
  num_candidates_ablation: [1, 2, 4]
  samples_per_od: 4

# --- inference-only ALM (augmented Lagrangian) guidance ------------------
# NOT migrated to the B-spline control-space state in this version.
# It stays DISABLED; enabling it would apply the old waypoint semantics to a
# control polygon, so the sampler refuses to run it.
alm:
  enabled: false
  log_per_step: true
  start_t: 7
  inner_steps: 4
  step_size: 0.03
  rho: 5.0
  proximity_weight: 1.0
  correction_smooth_weight: 20.0
  max_grad_norm: 1.0
  max_correction_per_step: 0.10
  safety_margin: 0.02
  obstacle_window_half: 0.35
  obstacle_dilation: 0
  guidance_dilation_cells: 1
  guidance_occupancy_threshold: 1.0e-3
  segment_collision_samples: 8
  corridor_chunk_size: 512
  ellipse_axis_min: 0.002
  ellipse_axis_max: 2.0
