# Fresh V1 training with direct obstacle clearance supervision for predicted
# physical ellipse centres. This experiment must not resume an older model.
base: configs/config_v1.yaml

loss:
  # Smoothness is intentionally disabled so it cannot influence the correction.
  lambda_smooth: 0.0
  lambda_center_safe: 0.1
  ellipse_center_safe_margin: 0.02

train:
  from_scratch: true
  epochs: 100
  ckpt_dir: "outputs/ckpt_v1_center_safe_scratch"
