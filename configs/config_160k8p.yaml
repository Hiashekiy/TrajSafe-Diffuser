# ============================================================
# ============================================================
# config_160k8p - same as config_160k8 but on the BORDER-PROTECTED k=8 cache
# (data/carla_processed_160k8p, built with 05_erode_occupancy.py
#  --border-mode protect).
#
# Why the 'p': the original k=8 cache was eroded with scipy's default
# border_value=0, which treats everything outside the 256^2 crop as FREE, so
# the crop's outer wall was eaten from the outside too and a 5 m free "moat"
# opened all around every scene (outermost 8 cells: 0.80-0.90 obstacle ->
# 0.000 in ALL samples).  The corridor and the planner could therefore loop
# around the map, and the reported free ratio was inflated by ~10 points.
# 'protect' restores the source occupancy in the outer k cells and counts the
# outside as obstacle, so that ring is never less blocked than the source.
# ============================================================
# TrajSafe-Diffuser - CARLA carla_full_160_256 (160 m / 256 px) profile.
#
#   Derived from configs/config.yaml.  Differences limited to:
#     data.root / data.processed_root  -> the 160 m dataset + its cache
#     data.scene_to_meter              -> 80.0 (reporting only)
#     bspline.knots                    -> auto (verified == carla_v1 knots.npy)
#     train.ckpt_dir                   -> outputs/bspline_carla_160/ckpt
#   ALL geometric knobs are deliberately UNCHANGED (see 00_build_processed.py).
#
#   ONE diffusion state: the control polygon Q_t [B,C,2] (C = num_controls).
#   The network NEVER sees decoded trajectory points any more: the control
#   polygon itself is the token sequence
#
#       Q_t [B,C,2] -> ControlEncoder -> ControlBackbone -> Q_coarse [B,C,2]
#                   -> Skeleton match (C query tokens)
#                   -> Q safety queries on the selected Skeleton
#                   -> safety -> control cross attention
#                   -> FinalControlDenoiser -> Q~_final [B,C,2]
#                   -> FIXED boundary decoder -> Q_final [B,C,2]
#                   -> (plot / metric / controller only) B C -> curve
#
#   C is the ONLY trajectory representation and comes from this file
#   (model.num_controls, mirrored by bspline.num_controls) - it is never
#   hard-coded.  ``model.num_safety_queries`` (= candidate_points) is the ONLY
#   place the number of Skeleton / ellipse geometry queries appears.
#
#   Ellipse centres are NOT a diffusion state, NOT a head output and NOT a
#   progress prediction: c_i = Gamma_m(i/(Q-1)) on the selected dense Skeleton.
#   There is no learned progress, no L_align and no L_traj.
# ============================================================

env:
  python: "E:/CondaEnvData/envs/GGMPC/python.exe"
  device: "cuda"
  seed: 42

data:
  dataset: "carla_v1"
  root: "D:/ProjectDirectory/Neural-IRISDiffuser/data/carla_full_160_256"
  processed_root: "D:/ProjectDirectory/Neural-IRISDiffuser/data/carla_processed_160k8p"
  # 160 m window maps onto scene [-1,1]  ->  1 scene unit = 80 m.
  # REPORTING/LOG ONLY: every geometric knob below is in SCENE units on a
  # fixed 256^2 grid, so the numeric geometry is unchanged by this value.
  scene_to_meter: 80.0
  batch_size: 16
  num_workers: 0
  splits: ["train", "val", "test"]
  ellipse_mask_res: 64                 # GT / prediction soft-mask resolution
  ellipse_mask_tau: 10.0
  # legacy Maze2D roots (kept so old tooling can still read the config)
  scenes: "data/scenes"
  skeleton: "data/skeleton"
  mazes: ["large"]

skeleton:
  safety_dilation_cells: 1
  thinning_backend: "auto"
  pure_cycle_aux_nodes: 2

# --- candidate topology (offline cache) ---------------------------------
topology:
  num_candidates: 4
  raw_k: 128
  max_length_ratio: 1.5
  dedup_jaccard: 0.75
  candidate_points: 128                # L, S_m network input length
  candidate_geometry_points: 1280      # dense Gamma_m padding budget
  anchor_candidates: 16
  tau_gt: 0.05

model:
  horizon: 128                         # decoded curve sampling density (B_128)
  num_controls: 32                     # C: cubic B-spline control polygon
  control_space: true                  # network runs on the C control tokens
  num_safety_queries: 128              # Q: Skeleton / ellipse geometry queries
  rel_bias_len: 128                    # relative index-bias table length (>= C,Q)
  d_model: 128
  num_heads: 4
  traj_blocks: 8                       # Control Backbone N_T
  skeleton_blocks: 2                   # Skeleton Transformer N_S
  final_blocks: 3                      # Final Control Denoiser N_F
  ffn_dim: 512
  map_res: 256
  global_mem_res: 16                   # C_G 16x16
  geo_decode_res: 64                   # fine-geometry decoder output
  geo_mem_res: 32                      # C_E 32x32
  geo_sigma: 0.25
  geo_bias_clip: 8.0
  dropout: 0.0
  coord_hidden: 256
  head_hidden: 256
  assert_shapes: true
  # Fixed, NOT learned, endpoint correction on the control polygon:
  #   Q*_i = Q~_i + w^s_i (S - Q~_0) + w^g_i (G - Q~_{C-1})
  # with w^s = profile on the first ``span`` controls and w^g its mirror at the
  # end (permanently 1.0 at both endpoints).  This is the single source of the
  # profile: the boundary loss reads it from the model.
  boundary_decoder:
    span: 4
    profile: [1.0, 0.75, 0.5, 0.25]
  # --- Historical Safety Feedback (上一轮 ALM 的安全修正作为下一步的条件) ----
  # 每个控制点的输入是 5 维 [x_safe, y_safe, dx, dy, valid]：
  #   feedback_control = Q0_safe_prev（上一轮原始预测本来就安全时为 Q0_raw_prev）
  #   feedback_delta   = Q0_safe_prev - Q0_raw_prev
  #   feedback_valid   = 1 当且仅当上一轮 ALM 输出通过了冻结的连续约束包
  # FeedbackEncoder(5 -> hidden -> d_model) 输出 h_fb，经门控残差
  #   h_ctrl <- h_ctrl + sigmoid(Linear([h_ctrl; h_fb])) * valid * h_fb
  # 注入到 h_ctrl，因此影响下游全部模块（coarse / MatchBlock / TopologyHead /
  # PathFeatureHead / 安全 cross-attention / FusionMLP / FinalDenoiser）。
  # zero_init 让新增模块在微调起点严格等价于旧网络；valid = 0 时是精确恒等，
  # 所以 warmup 阶段与旧模型逐位相同，旧 checkpoint 也可以直接推理。
  feedback:
    enabled: true
    hidden: 64
    zero_init: true
    dropout: 0.0

# --- fixed B-spline codec (src/geometry/bspline.py) ---------------------
# num_controls MUST agree with model.num_controls (the loader refuses to start
# otherwise).  ``knots`` may be a .npy path or "auto" (clamped uniform knot
# vector generated for the configured num_controls / degree), so C can be
# changed without regenerating a knot file.
bspline:
  degree: 3
  num_controls: 32
  curve_points: 128
  knots: "auto"                       # clamped uniform == carla_v1 knots.npy
  endpoint_constrained: true

# --- ellipse label generation (scripts/data/carla/02_build_ellipse_labels.py)
ellipse_label:
  num_orientations: 36
  local_radius: 0.25
  dilation: 1
  # The safe ellipse is TINY (semi-axes <= local_radius = 0.25 m = 0.8 cells),
  # so 48 boundary + 2x12 interior samples already cover every cell the ellipse
  # can touch; 8 binary steps give a ~0.4 % axis resolution.  The exact same
  # safety criterion as scripts/data/03_build_ellipse_labels.py is used.
  boundary_points: 48
  interior_rings: 2
  interior_angles: 12
  binary_iters: 8
  min_semi_axis: 1.0e-3

diffusion:
  timesteps: 16
  beta_schedule: "squaredcos_cap_v2"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "x0"

# --- loss ---------------------------------------------------------------
#   L = lam_ctrl   L_ctrl     (raw final controls Q~_1..C-2 vs GT controls)
#     + lam_coarse L_coarse   (raw coarse controls vs GT controls)
#     + lam_smooth L_smooth   (2nd/3rd differences OF THE CONTROL POLYGON)
#     + lam_bound  L_boundary (raw controls near both ends vs GT local shape)
#     + lam_topo   L_topo     + lam_shape L_shape
#     + lam_iou    L_iou      + lam_safe  L_safe
# There is NO L_traj: no 128-point decoded curve ever enters the loss.
# ``boundary_span`` / ``boundary_profile`` come from model.boundary_decoder
# (single source of truth); only the scalar weights are configured here.
loss:
  lambda_control: 0.2
  lambda_coarse: 0.5
  lambda_smooth: 0.08
  lambda_boundary: 0.2
  boundary_coarse_weight: 0.5
  smooth_acc_weight: 0.25
  smooth_jerk_weight: 1.0
  lambda_topology: 0.25
  lambda_shape: 0.08
  lambda_iou: 0.25
  lambda_safe: 0.15
  # Training-time ALM: penalty on the DECODED curve for lying outside the
  # precomputed safety corridor, measured as a distance in SCENE units
  # (1 unit = 80 m here).  0 disables the term.  The corridor comes from
  # scripts/data/carla_full/04_build_alm_constraints.py; samples whose
  # corridor never closed are masked out (~57 % of train, 74 % of val).
  lambda_alm: 0.3
  # --- 历史安全反馈损失（只作用于两步 rollout 的第二次“未经 ALM 修正”的输出）--
  # L_fbsafe: 第二次原始预测 Q0_raw(s) 对整个连续 Bezier 约束包的违反量
  #           （与推理阶段 bspline_alm_correct 用的是同一个 BSplineConstraintPack）
  # L_curve : 把 Q0_raw(s) 解码成曲线后惩罚二阶/三阶差分（真正的曲线平滑度，
  #           防止网络直接复制“安全但歪”的 ALM 输出）
  # 不加任何 ||Q_next - Q_safe_prev|| 蒸馏项：那会给网络一条“抄 ALM”的捷径。
  lambda_feedback_safe: 0.3
  lambda_curve_smooth: 0.1
  feedback_margin: 0.0
  feedback_curve_acc_weight: 0.25
  feedback_curve_jerk_weight: 1.0
  ellipse_safe_res: 64
  ellipse_mask_tau: 10.0
  ellipse_safe_chunk: 32
  safe_cvar_fraction: 0.2
  safe_cvar_weight: 1.0

train:
  epochs: 500
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  log_interval: 20
  save_every: 5
  eval_every: 1
  val_batches: 12
  max_hours: 9.0
  ckpt_dir: "outputs/bspline_carla_160k8p/ckpt"   # NEVER the 80 m run dir
  # --- 两步真实 rollout（训练侧）-----------------------------------------
  # 每个 batch 多跑一次真实链路：
  #   q_t -> 网络 -> Q0_raw(t) -> 真实 ALM -> Q0_safe(t) -> 真实 DDIM -> q_s
  #       -> feedback -> 网络 -> Q0_raw(s) -> 只对第二次原始输出算损失
  # 第一段 rollout 在 no_grad 下执行，梯度只回到第二次网络预测。
  # 走廊来自离线 alm_cell_*.npy（与推理同一套 BSplineConstraintPack），
  # 因此不需要在训练循环里重建 SafetyCorridor。
  #   rollout:        false 时完全退化为旧的一步训练
  #   drop_prob:      按比例把 feedback_valid 置 0，模拟 warmup / 无走廊样本，
  #                   保证网络不会只在“有反馈”这一种分布下工作
  #   step2_weight:   第二步 L_ctrl / L_coarse / L_boundary 的权重
  #   simulate_warmup: true 时整批强制 feedback_valid = 0（消融用）
  #   alm_inner_steps: 训练期 ALM 迭代步数（默认取 alm.inner_steps）
  #   topology:       第二步网络用哪个骨架
  #                     "expert"（默认）= 缓存里的 m*（离线走廊正是在它上面建的，
  #                       一定与约束包相容，但比推理"乐观"）；
  #                     "pi" = 第一次前向自己的 argmax(pi)（更接近推理路由，但
  #                       离线走廊未必属于被选中的骨架，属于待验证的实验项；
  #                       请对照日志里的 fb_topo_match / fb_valid_rate 判断）。
  #   另外：启用 rollout 后第一步的时间步从 [1, T) 采样（t=0 时不存在"下一次
  #   去噪"，s=t=0 会退化成 q_s == q_t 的重复前向）。
  feedback:
    rollout: true
    drop_prob: 0.25
    step2_weight: 0.5
    simulate_warmup: false
    topology: "expert"

eval:
  num_candidates_ablation: [1, 2, 4]
  samples_per_od: 4

# --- inference-only safety corridor + ALM guidance -----------------------
# Three-stage state machine in src/diffusion/sampler.py:
#   WARMUP  -> TRY_ACTIVATE (128 regions / overlap / gap bridge / freeze)
#           -> GUIDED (per-reverse-step control-space ALM, dual warm start)
# The corridor and the exact B-spline constraint pack are built ONCE and then
# frozen; only the network's clean prediction keeps being refreshed.
corridor:
  enabled: true

  # Area intersection over min-area; 0.10 is an initial experimental value and
  # the observed distribution is logged (never hard-code it in the code).
  min_overlap_ratio: 0.10

  # GCOPTER/FIRI style point-seeded gap region at the Skeleton progress
  # midpoint.  V1 allows at most ONE bridge per gap (no recursion).
  bridge:
    enabled: true
    max_bridge_per_gap: 1

  # How many topology candidates are tried before the corridor is declared
  # unclosable for this sample.
  topology_trials: 4

  # EllipseRegionBuilder knobs (absolute-centre semantics).
  region:
    safety_margin: 0.02
    obstacle_window_half: 0.35
    obstacle_dilation: 0
    corridor_chunk_size: 512
    ellipse_axis_min: 0.002
    ellipse_axis_max: 2.0

alm:
  enabled: true
  mode: "guided_bspline"       # "guided_bspline" | "final_only" (ablation B)

  # Metres per scene unit for the ALM log fields (mean/max_curve_correction_m).
  # Without this key sample() falls back to the module constant in
  # src/geometry/safety_corridor.py (40.0, the old 80 m crop), which would
  # report every correction at half its true size.
  scene_to_meter: 80.0

  # Counted in executed reverse network forwards, NEVER in absolute timesteps.
  warmup_reverse_steps: 3

  # If the first activation fails, keep denoising and retry; after this many
  # failed retries the sample finishes as raw diffusion (alm_status).
  max_activation_delay_steps: 2

  activation_inner_steps: 8
  # Measured (24 val / 16 test samples): inner_steps 6 -> 10 costs a little
  # extra time but lets the smoothed correction (below) still converge, so
  # the collision rate stays at its hw=0 value while the trajectory becomes
  # smooth.  See correction_smooth_kernel.
  inner_steps: 10

  step_size: 0.05

  rho: 5.0

  proximity_weight: 1.0
  # Penalises the smoothness of the CORRECTION inside the proximal metric.
  # In practice this does nothing: system = I + eta*hess with eta = 0.05 makes
  # the solve essentially the identity (measured: 0.1 -> 10 changes output
  # smoothness by under 1 %).  Kept for backward compatibility; the real
  # lever is correction_smooth_kernel below.
  correction_smooth_weight: 0.1

  # THE smoothing lever.  A violated constraint only needs about 4 control
  # points to move; with no coupling they are displaced IN PLACE and the
  # curve kinks exactly there.  Measured: the raw network has curve
  # 2nd-difference 0.0246 m and the ALM output 0.0351 m -- the ALM made the
  # trajectory 43 % rougher than the network it was correcting.  This
  # low-passes each per-iteration step along the CONTROL axis so the
  # neighbours are dragged along with a triangular decay.
  #   hw=0  val 2nd-diff 0.0340 m, obstacle 0.000 %   (old behaviour)
  #   hw=3  val 2nd-diff 0.0279 m, obstacle 0.130 %
  #   hw=5  val 2nd-diff 0.0272 m, obstacle 0.130 %   (GT is 0.0264 m)
  #   hw=3 with inner_steps=10 -> val 0.0289 m, obstacle still 0.000 %
  # 0 disables the filter.
  correction_smooth_kernel: 3
  correction_smooth_sigma: 0.0     # 0 = triangular kernel

  constraint_tol: 1.0e-3

  # feedback_valid 的判定阈值：只有最终违反量 <= 该值的 ALM 输出才会成为
  # 下一轮的历史反馈（feedback_valid = 1）。默认等于 constraint_tol。
  # 实测（见下方 max_curve_step_scene 的记录）：best_task 模型上 ALM 收敛后的
  # 残余违反量 max 约 0.004 scene，若沿用 1e-3 会把"实际已经安全"的结果判为失败，
  # 反馈几乎永不激活；1 scene = 80 m，1e-2 scene = 0.8 m。
  # 语义提醒：这是"可接受的近似可行反馈"，不是严格安全保证——放宽它意味着把
  # 带少量残余违反的 Q0_safe 也当作历史条件喂给下一步。严格判定请设回
  # constraint_tol 并接受反馈激活率下降。
  # 请结合训练日志里的 fb_valid_rate 调整（0 表示反馈分支完全没被训练到）。
  feedback_accept_tol: 1.0e-2

  # Scene-normalised units: the CARLA crop is 80 m over [-1,1], so
  # 0.01 scene == 0.4 m.  This is the trust region of ONE inner ALM step,
  # measured on the REAL curve displacement max_i ||B dQ_i||.
  #
  # MEASURED (best_task.pt, test samples 1/3/7/11, 16 reverse steps, 4 seeds):
  #   step 0.01 + inner 3  -> final violation mean 0.041 / max 0.130,
  #                           corridor membership 0.862, 1/4 still colliding
  #   step 0.03 + inner 6  -> final violation mean -0.011 / max 0.004,
  #                           corridor membership 0.998, 0/4 colliding
  # The raw network prediction sits ~3-6 m away from the Skeleton the corridor
  # is built on, so the spec's initial 0.4 m/step budget cannot close it inside
  # the guided phase.  Re-measure and re-tune if the checkpoint changes.
  max_curve_step_scene: 0.03

  inherit_dual_across_reverse_steps: true

  dense_verify_points: 512
  log_per_step: true

  # region-builder keys may also be mirrored here (legacy place); the
  # ``corridor.region`` block wins when both are present.
  safety_margin: 0.02
  obstacle_window_half: 0.35
  obstacle_dilation: 0
  corridor_chunk_size: 512
  ellipse_axis_min: 0.002
  ellipse_axis_max: 2.0